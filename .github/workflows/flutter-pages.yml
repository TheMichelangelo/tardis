name: Build Flutter Web and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # Keep CI on the validated SDK; newer stable releases can add analyzer failures.
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /tardis/
      - run: |
          mkdir -p build/web/src
          cp -R public/src/. build/web/src/
          find build/web/src -type f \( -name '*.tex' -o -name '.DS_Store' \) -delete
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v6
      # This documented Pages pair uses the same artifact service client.
      # upload-pages-artifact@v5 uses upload-artifact@v7, which the deployment
      # action cannot discover with its older artifact client.
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: build/web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
